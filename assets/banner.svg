<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">RolandCipher — Analysis, Technology and Creativity</title>
  <desc id="desc">A personal technology banner focused on analysis, software, systems and practical problem solving.</desc>

  <defs>
    <radialGradient id="glowBlue" cx="82%" cy="24%" r="58%">
      <stop offset="0" stop-color="#007dbe" stop-opacity=".34"/>
      <stop offset="1" stop-color="#007dbe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSlate" cx="64%" cy="100%" r="58%">
      <stop offset="0" stop-color="#5089a9" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5089a9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#324f5d"/>
      <stop offset=".48" stop-color="#5089a9"/>
      <stop offset="1" stop-color="#007dbe"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5089a9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5089a9"/>
      <stop offset="1" stop-color="#5089a9" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="440" rx="28"/></clipPath>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      .sans { font-family: Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .scan { animation: scan 7s cubic-bezier(.16,1,.3,1) infinite; }
      @keyframes scan {
        0% { transform: translateX(-230px); opacity: 0 }
        12% { opacity: 1 }
        60% { transform: translateX(230px); opacity: .9 }
        70%,100% { transform: translateX(230px); opacity: 0 }
      }
      .pulse { animation: pulse 2.4s ease-out infinite; transform-origin: 96px 383px; }
      @keyframes pulse {
        0% { transform: scale(1); opacity: .7 }
        100% { transform: scale(3.1); opacity: 0 }
      }
      @media (prefers-reduced-motion: reduce) {
        .scan, .pulse { animation: none }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="#07131b"/>
    <rect width="1280" height="440" fill="url(#grid)"/>
    <rect width="1280" height="440" fill="url(#glowBlue)"/>
    <rect width="1280" height="440" fill="url(#glowSlate)"/>

    <path d="M0 390 L310 -20" stroke="#5089a9" stroke-opacity=".18" stroke-width="1.5" fill="none"/>
    <path d="M85 460 L395 -20" stroke="#007dbe" stroke-opacity=".18" stroke-width="1.5" fill="none"/>

    <!-- Abstract systems / data motif -->
    <g transform="translate(930 220)">
      <circle r="145" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="1.5"/>
      <circle r="116" fill="none" stroke="url(#brand)" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="3 10"/>
      <circle r="84" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1"/>
      <circle r="52" fill="#0d2533" stroke="#5089a9" stroke-opacity=".75" stroke-width="1.5"/>
      <circle r="17" fill="#007dbe" fill-opacity=".9"/>
      <circle r="25" fill="none" stroke="#5089a9" stroke-opacity=".65" stroke-width="1.5"/>
      <g stroke="#5089a9" stroke-opacity=".72" stroke-width="1.5" fill="none">
        <path d="M0 -84V-52 M84 0H52 M0 84V52 M-84 0H-52"/>
        <path d="M59 -59L37 -37 M59 59L37 37 M-59 59L-37 37 M-59 -59L-37 -37"/>
      </g>
      <g fill="#7fb5d1">
        <circle cx="0" cy="-116" r="4"/>
        <circle cx="116" cy="0" r="4"/>
        <circle cx="0" cy="116" r="4"/>
        <circle cx="-116" cy="0" r="4"/>
        <circle cx="82" cy="-82" r="3"/>
        <circle cx="-82" cy="82" r="3"/>
      </g>
      <g class="scan">
        <line x1="0" y1="-190" x2="-115" y2="190" stroke="url(#beam)" stroke-width="9" filter="url(#softGlow)" opacity=".65"/>
        <line x1="0" y1="-190" x2="-115" y2="190" stroke="url(#beam)" stroke-width="2"/>
      </g>
      <path d="M-150 0H-130 M130 0H150 M0 -150V-130 M0 130V150" stroke="#007dbe" stroke-opacity=".55" stroke-width="2"/>
    </g>

    <text x="80" y="74" class="mono" font-size="14" letter-spacing="4" fill="#a9c0ce" fill-opacity=".82">INDEPENDENT TECHNOLOGY PROFILE · @ROLANDCIPHER</text>
    <rect x="80" y="92" width="52" height="3" rx="1.5" fill="#5089a9"/>

    <text x="74" y="202" class="sans" font-size="91" font-weight="750" letter-spacing="-3">
      <tspan fill="#7fb5d1">Roland</tspan><tspan fill="#f5f8fa">Cipher</tspan>
    </text>

    <text x="82" y="264" class="sans" font-size="25" font-weight="500" fill="#f5f8fa" fill-opacity=".88">
      Analysis, technology, and creativity.
    </text>
    <text x="82" y="303" class="sans" font-size="20" font-weight="400" fill="#c1d0d9" fill-opacity=".82">
      Turning complex problems into practical solutions.
    </text>

    <circle class="pulse" cx="96" cy="383" r="5" fill="#007dbe"/>
    <circle cx="96" cy="383" r="5" fill="#7fb5d1"/>
    <text x="114" y="388" class="mono" font-size="13" letter-spacing="1.7" fill="#d5e2e9" fill-opacity=".88">
      PYTHON · LINUX · STREAMLIT · DATA ANALYSIS
    </text>

    <text x="1200" y="410" class="mono" font-size="13" letter-spacing="2" fill="#a9c0ce" fill-opacity=".65" text-anchor="end">GITHUB.COM/ROLANDCIPHER</text>
    <rect y="434" width="1280" height="6" fill="url(#brand)"/>
  </g>
</svg>
